services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: usuario_test
      POSTGRES_PASSWORD: password_test
      POSTGRES_DB: db_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario_test -d db_test"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://usuario_test:password_test@db:5432/db_test
    depends_on:
      db:
        condition: service_healthy