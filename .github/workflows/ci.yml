name: CI/CD - Calidad, Seguridad, Pruebas y Registro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  pipeline-contenedor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      # STEP 1: Linter de Dockerfile
      - name: Linter de Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile

      # STEP 2: Configurar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 3: Compilar imagen para pruebas estáticas
      - name: Compilar imagen Docker local
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mi-flask-app:test

      # STEP 4: Escáner Trivy
      - name: Escáner de Vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mi-flask-app:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # STEP 5: PRUEBAS DE INTEGRACIÓN CON DOCKER COMPOSE
      - name: Levantamiento del entorno de pruebas (Docker Compose)
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          # Esperar a que la API responda
          sleep 5

      # STEP 6: Ejecutar Pruebas con pytest
      - name: Ejecutar pruebas de integración
        run: |
          pip install pytest requests
          pytest tests/test_integration.py -v

      # STEP 7: Detener entorno de pruebas
      - name: Limpiar entorno de pruebas
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

      # STEP 8: Autenticación en GHCR (Solo en push a main)
      - name: Autenticación en GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STEP 9: Extraer metadatos
      - name: Extraer metadatos de Docker (Tags y Labels)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # STEP 10: Publicar Imagen en GHCR
      - name: Publicar Imagen en GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}