name: CI/CD Pipeline - Containerized Flask App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # JOB 1: INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  ci-y-publicacion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      # STEP 1: Linter de Dockerfile
      - name: Linter de Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile

      # STEP 2: Configurar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 3: Compilar imagen para análisis estático
      - name: Compilar imagen Docker local
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mi-flask-app:test

      # STEP 4: Escáner Trivy
      - name: Escáner de Vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-flask-app:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # STEP 5: Entorno de pruebas (Docker Compose + PostgreSQL)
      - name: Levantamiento del entorno de pruebas
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          sleep 5

      # STEP 6: Pruebas de integración con Pytest
      - name: Ejecutar pruebas de integración
        run: |
          pip install pytest requests
          pytest tests/test_integration.py -v

      # STEP 7: Limpieza del entorno de pruebas
      - name: Limpiar entorno de pruebas
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

      # STEP 8: Autenticación en GHCR (Solo push a main)
      - name: Autenticación en GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STEP 9: Extraer metadatos y etiquetas
      - name: Extraer metadatos de Docker (Tags)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # STEP 10: Publicar Imagen en GHCR
      - name: Publicar Imagen en GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: push_step
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

    # Exportamos el SHA corto como salida para el Job de CD
    outputs:
      image_tag: sha-${{ github.sha }}

  # ==========================================
  # JOB 2: DESPLIEGUE CONTINUO (CD)
  # ==========================================
  cd-despliegue:
    needs: ci-y-publicacion
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # STEP 1: Autenticación en GHCR para descargar la imagen
      - name: Autenticación en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STEP 2: Descargar la versión inmutable específica usando el OUTPUT
      - name: Descargar imagen desplegable desde GHCR
        run: |
          TAG="${{ needs.ci-y-publicacion.outputs.image_tag }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}:$TAG"
          
          echo "Descargando versión inmutable exacta: $IMAGE_NAME"
          docker pull $IMAGE_NAME

      # STEP 3: Simulación de Despliegue en Producción con el TAG inmutable
      - name: Iniciar contenedor en producción
        run: |
          TAG="${{ needs.ci-y-publicacion.outputs.image_tag }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}:$TAG"
          
          docker run -d \
            --name app-produccion \
            -p 5000:5000 \
            -e DATABASE_URL="sqlite:///:memory:" \
            $IMAGE_NAME
          
          # Pausa para dar tiempo al arranque del servidor Gunicorn
          sleep 3

      # STEP 4: Verification / Health Check Post-Despliegue
      - name: Validar Health Check Post-Despliegue
        run: |
          echo "Verificando estado del servicio desplegado..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Despliegue exitoso. El servicio responde HTTP 200 OK."
          else
            echo "❌ Fallo en el despliegue. Código HTTP recibido: $HTTP_STATUS"
            docker logs app-produccion
            exit 1
          fi

      # STEP 5: Limpieza de recursos del runner
      - name: Limpiar contenedor de producción
        if: always()
        run: |
          docker stop app-produccion || true
          docker rm app-produccion || true